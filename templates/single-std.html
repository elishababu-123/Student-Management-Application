<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Details</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f4f6f9; margin: 0; color: #222; }
    nav { background: #1f2a44; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    nav a.brand { color: #fff; text-decoration: none; font-weight: 600; }
    .container { max-width: 1000px; margin: 24px auto; padding: 0 16px; }

    .btn { display: inline-block; padding: 8px 14px; border: none; border-radius: 6px; background: #2f6fed; color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
    .btn:hover { opacity: .9; }
    .btn.green { background: #1e9e5a; }
    .btn.red { background: #d64545; }
    .btn.grey { background: #6b7280; }

    .card { background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.1); max-width: 500px; margin: auto; }
    .profile-card { text-align: center; }
    .avatar { width: 140px; height: 140px; object-fit: cover; border-radius: 50%; }

    .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; color: #fff; }
    .badge.active { background: #1e9e5a; }
    .badge.inactive { background: #d64545; }

    .actions { display: flex; gap: 6px; align-items: center; justify-content: center; }
    .actions form { margin: 0; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="/">🎓 Student Manager</a>
    <a class="btn green" href="/students/add">+ Add Student</a>
  </nav>

  <div class="container">
    {% if std %}
    <div class="card profile-card">
      <img class="avatar" src="{{ std[6] }}" alt="{{ std[1] }}">
      <h2>{{ std[1] }}</h2>
      <p><b>ID:</b> {{ std[0] }}</p>
      <p><b>Age:</b> {{ std[2] }}</p>
      <p><b>Gender:</b> {{ std[3] }}</p>
      <p><b>Marks:</b> {{ std[4] }}</p>
      <p><b>Course:</b> {{ std[5] }}</p>
      <p><b>Status:</b>
        {% if std[7] == 1 %}<span class="badge active">Active</span>
        {% else %}<span class="badge inactive">Inactive</span>{% endif %}
      </p>
      <div class="actions">
        <a class="btn grey" href="/">← Back</a>
        <a class="btn" href="/student/edit/{{ std[0] }}">Edit</a>
        <form method="post" action="/std/delete/{{ std[0] }}" onsubmit="return confirm('Delete this student?')">
          <button class="btn red" type="submit">Delete</button>
        </form>
      </div>
    </div>
    {% else %}
    <div class="card">
      <p>Student not found.</p>
      <a class="btn grey" href="/">← Back</a>
    </div>
    {% endif %}
  </div>
</body>
</html>
