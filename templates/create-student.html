<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Student</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f4f6f9; margin: 0; color: #222; }
    nav { background: #1f2a44; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    nav a.brand { color: #fff; text-decoration: none; font-weight: 600; }
    .container { max-width: 1000px; margin: 24px auto; padding: 0 16px; }

    .btn { display: inline-block; padding: 8px 14px; border: none; border-radius: 6px; background: #2f6fed; color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
    .btn:hover { opacity: .9; }
    .btn.green { background: #1e9e5a; }
    .btn.grey { background: #6b7280; }

    .card { background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.1); max-width: 500px; margin: auto; }

    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input, select { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #2f6fed; }
    .form-buttons { margin-top: 24px; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="/">🎓 Student Manager</a>
    <a class="btn green" href="/students/add">+ Add Student</a>
  </nav>

  <div class="container">
    <div class="card">
      <h2>Add Student</h2>
      <form method="post" action="/students/add">
        <label>Name (3-25 chars)</label>
        <input type="text" name="name" minlength="3" maxlength="25" required>

        <label>Age (18-60)</label>
        <input type="number" name="age" min="18" max="60" required>

        <label>Gender</label>
        <select name="gender" required>
          <option value="">-- Select --</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>

        <label>Marks (1-100)</label>
        <input type="number" name="marks" min="1" max="100" required>

        <label>Course</label>
        <input type="text" name="course" required>

        <label>Image URL</label>
        <input type="url" name="image" placeholder="https://..." required>

        <label>Status</label>
        <select name="status" required>
          <option value="1">Active</option>
          <option value="0">Inactive</option>
        </select>

        <div class="form-buttons">
          <button class="btn green" type="submit">Save Student</button>
          <a class="btn grey" href="/">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
